name: Update quotes

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/quotes.json"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Yahoo quotes
        run: python3 scripts/fetch_quotes.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          if git diff --staged --quiet; then
            echo "No quote changes"
          else
            git commit -m "chore: update quotes $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
